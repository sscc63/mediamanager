<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 - 配置管理</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo1.svg">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5436D6">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 本页背景为深色渐变：声明 dark，使 iOS 独立窗口状态栏文字为白色（深色文字在蓝紫底上看不清） */
        :root { color-scheme: dark; }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(60, 40, 120, 0.9) inset;
            -webkit-text-fill-color: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2842fc 0%, #b11c84 50%, #f74a2b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 顶部让出状态栏/灵动岛，底部让出 Home 指示条；渐变背景仍铺满整屏 */
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰光斑 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: rgba(255, 255, 255, 0.22);
            top: -120px;
            right: -120px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: rgba(20, 10, 60, 0.25);
            bottom: -120px;
            left: -100px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            width: 112px;
            height: 112px;
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.28);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.88);
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 36px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            z-index: 2;            /* 置于输入框之上，避免被 backdrop-filter 模糊 */
            pointer-events: none;  /* 不拦截点击，输入框正常聚焦 */
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(255, 255, 255, 0.16);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            outline: none;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #b11c84;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .loader.show {
            display: inline-block;
        }

        .spinner {
            border: 3px solid rgba(177, 28, 132, 0.3);
            border-top: 3px solid #b11c84;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                max-width: 340px;
            }

            .logo img {
                width: 96px;
                height: 96px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/static/logo.svg" alt="logo">
        </div>
        <p class="subtitle">云盘自动转存管理系统</p>

        <div id="error-message" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="submit-btn">
                登 录
                <span class="loader" id="loader">
                    <span class="spinner"></span>
                </span>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 显示加载状态
            submitBtn.disabled = true;
            loader.classList.add('show');
            errorMsg.classList.remove('show');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();

                if (data.success) {
                    // 登录成功，添加成功动画
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> 登录成功';
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 500);
                } else {
                    throw new Error('用户名或密码错误');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMsg.textContent = error.message || '登录失败，请重试';
                errorMsg.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                loader.classList.remove('show');
            }
        });
    </script>
</body>
</html>
